[toolchain]
anchor_version = "0.31.1"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.devnet]
faucet = "3Ckfn1LMByoDfVpcDPf7nouk5nQAUm51Zkdf1oprQTAK"
flashloan_receiver_example = "GmtswKBDrFZ9DfUfP7jbPFvbtuG7AJcX73SvoKWGxJbu"
omnipair = "omnixgS8fnqHfCcTGKWj6JtKjzpJZ1Y5y9pyFkQDkYE"

[programs.localnet]
faucet = "3Ckfn1LMByoDfVpcDPf7nouk5nQAUm51Zkdf1oprQTAK"
flashloan_receiver_example = "GmtswKBDrFZ9DfUfP7jbPFvbtuG7AJcX73SvoKWGxJbu"
omnipair = "omnixgS8fnqHfCcTGKWj6JtKjzpJZ1Y5y9pyFkQDkYE"

[programs.mainnet]
omnipair = "omnixgS8fnqHfCcTGKWj6JtKjzpJZ1Y5y9pyFkQDkYE"

[registry]
# Keyed endpoints do not belong in a tracked file. Override locally with
# ANCHOR_PROVIDER_URL, or pass -u to the CLI.
url = "https://api.mainnet-beta.solana.com"

[provider]
cluster = "mainnet"
wallet = "deployer-keypair.json"

[workspace]
members = ["programs/omnipair", "programs/faucet"]

[scripts]
build-devnet = "anchor build -- --features \"development\""
build-mainnet = "anchor build -p omnipair -- --features \"production\""
